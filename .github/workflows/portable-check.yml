name: Portable research checks

# Manual only: no inference and no automatically scheduled runner spending.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-clone:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check frozen bytes and saved statistics
        run: python -B -X utf8 -m scripts.portable check
      - name: Test portable fresh-clone interface
        run: python -B -X utf8 -m unittest discover -s tests_portable -v
